name: pipeline-observatorio

on:
  schedule:
    # Ejecucion diaria a las 11:00 UTC (06:00 en Colombia).
    - cron: "0 11 * * *"

  workflow_dispatch:
    inputs:
      forzar:
        description: "Volver a descargar todas las fuentes (ignora la cache de bronce)"
        type: boolean
        default: false

  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar librerias
        run: python -m pip install -r requirements.txt

      - name: Restaurar la capa bronce (cache)
        if: ${{ inputs.forzar != true }}
        uses: actions/cache/restore@v5
        with:
          path: data/bronze
          key: bronce-${{ hashFiles('src/config.py', 'src/extract/*.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bronce-${{ hashFiles('src/config.py', 'src/extract/*.py') }}-

      - name: Capa bronce (extraccion de las 5 fuentes)
        timeout-minutes: 90
        shell: bash
        env:
          FORZAR: ${{ inputs.forzar }}
        run: |
          if [[ "$FORZAR" == "true" ]]; then
            python -m src.pipeline --forzar
          else
            python -m src.pipeline
          fi

      - name: Guardar la capa bronce (cache)
        if: ${{ success() }}
        uses: actions/cache/save@v5
        with:
          path: data/bronze
          key: bronce-${{ hashFiles('src/config.py', 'src/extract/*.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Capa plata (limpieza y Pandera de todas las fuentes)
        run: python -m src.transformar

      - name: Capa oro (dbt build)
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Pruebas (pytest)
        run: python -m pytest -v

      - name: Exportar la capa oro
        run: python -m src.exportar_oro

      - name: Publicar la capa oro
        uses: actions/upload-artifact@v6
        with:
          name: capa-oro
          path: data/gold/
          retention-days: 7
          if-no-files-found: error

      - name: Publicar el reporte de calidad
        uses: actions/upload-artifact@v6
        with:
          name: reporte-calidad
          path: docs/reporte_calidad.md
          retention-days: 7
          if-no-files-found: error
