# Pruebas de dbt sobre la capa oro. "dbt build" las ejecuta despues de crear cada tabla.
# Es un archivo YAML: no se ejecuta; dbt lo lee para saber que probar en cada tabla.

# La version del formato de este archivo (dbt pide 2)
version: 2

# La lista de modelos (tablas) y sus pruebas
models:
  # La tabla dim_mes
  - name: dim_mes
    # Una descripcion corta de la tabla (sale en la documentacion de dbt)
    description: "Un mes con ventas."
    # Las columnas que se prueban
    columns:
      # La columna mes_id (la llave)
      - name: mes_id
        # unique: no se repite; not_null: nunca esta vacia
        data_tests: [unique, not_null]

  # La tabla dim_municipio
  - name: dim_municipio
    description: "Un municipio de Antioquia con su codigo DIVIPOLA."
    columns:
      # La llave: no se repite y nunca esta vacia
      - name: municipio_id
        data_tests: [unique, not_null]

  # La tabla dim_segmento
  - name: dim_segmento
    description: "Un segmento de cliente."
    columns:
      # La llave: no se repite y nunca esta vacia
      - name: segmento_id
        data_tests: [unique, not_null]

  # La tabla de hechos
  - name: fact_ventas_mensual
    description: "Ventas de energia por mes, municipio, segmento y tipo de compra."
    columns:
      # La llave al mes
      - name: mes_id
        data_tests:
          # Nunca esta vacia
          - not_null
          # relationships: cada mes_id del hecho debe existir en dim_mes
          # (si no, seria una venta de un mes que no esta en la dimension)
          - relationships:
              arguments:
                # La tabla con la que se compara
                to: ref('dim_mes')
                # La columna de esa tabla
                field: mes_id
      # La llave al municipio: nunca vacia y debe existir en dim_municipio
      - name: municipio_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: municipio_id
      # La llave al segmento: nunca vacia y debe existir en dim_segmento
      - name: segmento_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_segmento')
                field: segmento_id
      # El tipo de compra
      - name: tipo_compra
        data_tests:
          # accepted_values: solo se aceptan los valores de esta lista
          - accepted_values:
              arguments:
                values: ["Bolsa", "Contrato"]


  # DIMENSION FECHA
  - name: dim_fecha
    description: "Calendario diario con fase ENSO."
    columns:
      - name: fecha_id
        data_tests: [unique, not_null]
      - name: fecha
        data_tests: [unique, not_null]
      - name: fase_enso
        data_tests:
          - accepted_values:
              arguments:
                values: ["El Niño", "La Niña", "Neutral", "Sin dato"]

  # DIMENSION RECURSO
  - name: dim_recurso
    description: "Catalogo de plantas y recursos de XM."
    columns:
      - name: recurso_id
        data_tests: [unique, not_null]
      - name: nombre_recurso
        data_tests: [not_null]

  # HECHOS: MERCADO HORARIO
  - name: fact_mercado_horario
    description: "Precio de bolsa y demanda por fecha y hora."
    columns:
      - name: fecha_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_id
      - name: hora
        data_tests: [not_null]
      - name: precio_bolsa
        data_tests: [not_null]
      - name: demanda
        data_tests: [not_null]

  # HECHOS: GENERACION POR RECURSO
  - name: fact_generacion_recurso
    description: "Generacion electrica horaria por recurso XM."
    columns:
      - name: fecha_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_id
      - name: recurso_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_recurso')
                field: recurso_id
      - name: hora
        data_tests: [not_null]
      - name: generacion
        data_tests: [not_null]
